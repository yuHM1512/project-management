<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=inter:wght@100..900&family=manrope:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(249, 249, 250, 0.8);
            backdrop-filter: blur(24px);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#00201b",
                        "surface-container-highest": "#e2e2e3",
                        "inverse-on-surface": "#f0f1f2",
                        "on-surface-variant": "#42474f",
                        "inverse-primary": "#a1c9ff",
                        "error-container": "#ffdad6",
                        "background": "#f9f9fa",
                        "on-surface": "#1A1C1D",
                        "tertiary-fixed-dim": "#96d2c6",
                        "on-tertiary-container": "#7cb7ab",
                        "primary-fixed": "#d2e4ff",
                        "outline-variant": "#c2c7d1",
                        "surface-variant": "#e2e2e3",
                        "surface-container-lowest": "#FFFFFF",
                        "error": "#ba1a1a",
                        "surface-container-high": "#EBEBEB",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#b2eee1",
                        "outline": "#727780",
                        "primary": "#002c50",
                        "secondary": "#1b6d24",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#82afe9",
                        "on-error-container": "#93000a",
                        "surface-tint": "#2f6195",
                        "surface-container-low": "#F3F3F4",
                        "primary-fixed-dim": "#a1c9ff",
                        "surface": "#F9F9FA",
                        "tertiary-container": "#004940",
                        "tertiary": "#00312a",
                        "secondary-fixed": "#a3f69c",
                        "on-secondary-container": "#207128",
                        "surface-bright": "#f9f9fa",
                        "inverse-surface": "#2f3132",
                        "primary-container": "#004275",
                        "secondary-fixed-dim": "#87d982",
                        "on-secondary-fixed-variant": "#005312",
                        "secondary-container": "#a0f499",
                        "on-primary-fixed": "#001c37",
                        "surface-dim": "#dadadb",
                        "on-secondary-fixed": "#002204",
                        "on-primary": "#ffffff",
                        "on-background": "#1a1c1d",
                        "on-primary-fixed-variant": "#0e487c",
                        "on-error": "#ffffff",
                        "surface-container": "#eeeeef",
                        "on-tertiary-fixed-variant": "#0c5047"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "1.5rem",
                        "stack-md": "1rem",
                        "margin-mobile": "1rem",
                        "stack-lg": "1.5rem",
                        "stack-sm": "0.5rem",
                        "margin-desktop": "4rem"
                    },
                    "fontFamily": {
                        "headline-md": ["manrope"],
                        "display-lg": ["manrope"],
                        "body-md": ["inter"],
                        "display-lg-mobile": ["manrope"],
                        "label-md": ["inter"],
                        "body-lg": ["inter"],
                        "headline-lg": ["manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-lg": ["56px", {"lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display-lg-mobile": ["40px", {"lineHeight": "48px", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-on-surface/10 backdrop-blur-sm z-0"></div>
<!-- Main Modal Canvas -->
<main class="relative z-10 w-full max-w-[640px] bg-surface-container-lowest rounded-xl shadow-2xl overflow-hidden flex flex-col">
<!-- Header Section (Asymmetric Intent) -->
<header class="pt-10 pb-8 px-10 bg-surface-container-lowest">
<div class="flex justify-between items-start">
<div class="space-y-1">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Cấu hình công việc định kỳ</h1>
<p class="font-label-md text-label-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">person</span>
                        Phạm Ngọc Minh Trí · Tuần thủ
                    </p>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-all">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
</header>
<!-- Frequency Grid (Editorial Layout) -->
<div class="px-10 pb-10 space-y-6">
<!-- Hàng tuần - Blue -->
<section class="bg-surface-container-low rounded-xl p-6 transition-all hover:bg-surface-container-low/80">
<div class="flex justify-between items-center mb-4">
<div class="flex items-center gap-3">
<div class="w-2 h-8 bg-blue-500 rounded-full"></div>
<h2 class="font-headline-md text-headline-md text-primary">Hàng tuần</h2>
</div>
<div class="flex items-center gap-4">
<span class="font-label-md text-label-md bg-blue-100 text-blue-700 px-3 py-1 rounded-full">12 công việc</span>
<button class="font-label-md text-label-md text-primary hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span>
                            + Thêm
                        </button>
</div>
</div>
</section>
<!-- Hàng tháng - Green -->
<section class="bg-surface-container-low rounded-xl p-6 transition-all hover:bg-surface-container-low/80">
<div class="flex justify-between items-center mb-4">
<div class="flex items-center gap-3">
<div class="w-2 h-8 bg-secondary rounded-full"></div>
<h2 class="font-headline-md text-headline-md text-primary">Hàng tháng</h2>
</div>
<div class="flex items-center gap-4">
<span class="font-label-md text-label-md bg-green-100 text-on-secondary-fixed-variant px-3 py-1 rounded-full">5 công việc</span>
<button class="font-label-md text-label-md text-primary hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span>
                            + Thêm
                        </button>
</div>
</div>
</section>
<!-- Hàng quý - Amber (Active State) -->
<section class="bg-surface-container-lowest border-2 border-amber-200 rounded-xl p-6 shadow-sm transition-all">
<div class="flex justify-between items-center mb-6">
<div class="flex items-center gap-3">
<div class="w-2 h-8 bg-amber-500 rounded-full"></div>
<h2 class="font-headline-md text-headline-md text-primary">Hàng quý</h2>
</div>
<div class="flex items-center gap-4">
<span class="font-label-md text-label-md bg-amber-100 text-amber-800 px-3 py-1 rounded-full">3 công việc</span>
<button class="font-label-md text-label-md text-primary hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add_circle</span>
                            + Thêm
                        </button>
</div>
</div>
<!-- Inline Input Active -->
<div class="bg-surface-container-high rounded-xl p-5 space-y-4 animate-in fade-in slide-in-from-top-2 duration-300">
<div class="grid grid-cols-1 gap-4">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Tên công việc mới</label>
<input class="w-full bg-surface-container-lowest border-none rounded-md px-4 py-3 font-body-md focus:ring-2 focus:ring-primary/20 placeholder:text-outline/50 transition-all" placeholder="Nhập tên công việc..." type="text"/>
</div>
<div class="flex gap-4">
<div class="flex-1 space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Ngày bắt đầu</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none rounded-md px-4 py-3 font-body-md" type="text" value="01/04/2024"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant">calendar_today</span>
</div>
</div>
<div class="flex-1 space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1">Người phụ trách</label>
<select class="w-full bg-surface-container-lowest border-none rounded-md px-4 py-3 font-body-md appearance-none">
<option>Trần Thế Anh</option>
<option selected="">Phạm Ngọc Minh Trí</option>
</select>
</div>
</div>
</div>
</div>
</section>
<!-- 6 tháng - Pink -->
<section class="bg-surface-container-low rounded-xl p-6 transition-all hover:bg-surface-container-low/80">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-2 h-8 bg-pink-500 rounded-full"></div>
<h2 class="font-headline-md text-headline-md text-primary">6 tháng</h2>
</div>
<div class="flex items-center gap-4">
<span class="font-label-md text-label-md bg-pink-100 text-pink-700 px-3 py-1 rounded-full">2 công việc</span>
<button class="font-label-md text-label-md text-primary hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span>
                            + Thêm
                        </button>
</div>
</div>
</section>
<!-- Hàng năm - Violet -->
<section class="bg-surface-container-low rounded-xl p-6 transition-all hover:bg-surface-container-low/80">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-2 h-8 bg-violet-500 rounded-full"></div>
<h2 class="font-headline-md text-headline-md text-primary">Hàng năm</h2>
</div>
<div class="flex items-center gap-4">
<span class="font-label-md text-label-md bg-violet-100 text-violet-700 px-3 py-1 rounded-full">1 công việc</span>
<button class="font-label-md text-label-md text-primary hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span>
                            + Thêm
                        </button>
</div>
</div>
</section>
<!-- Khi phát sinh - Slate -->
<section class="bg-surface-container-low rounded-xl p-6 transition-all hover:bg-surface-container-low/80">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-2 h-8 bg-slate-500 rounded-full"></div>
<h2 class="font-headline-md text-headline-md text-primary">Khi phát sinh</h2>
</div>
<div class="flex items-center gap-4">
<span class="font-label-md text-label-md bg-slate-200 text-slate-700 px-3 py-1 rounded-full">0 công việc</span>
<button class="font-label-md text-label-md text-primary hover:underline flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">add</span>
                            + Thêm
                        </button>
</div>
</div>
</section>
</div>
<!-- Sticky Footer Action -->
<footer class="mt-auto px-10 py-8 bg-surface-container-lowest flex justify-end items-center gap-4 border-t border-surface-container-low">
<button class="px-6 py-2.5 rounded-md font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-high transition-all">
                Hủy bỏ
            </button>
<button class="px-8 py-2.5 rounded-md font-label-md text-label-md text-on-primary bg-gradient-to-r from-primary to-primary-container shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">check_circle</span>
                Xác nhận lưu cấu hình
            </button>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('section').forEach(section => {
            section.addEventListener('click', function() {
                // Toggle active state visualization
                if (!this.classList.contains('border-amber-200')) {
                    // Simulation logic: In a real app we'd swap content
                    console.log('Switching frequency tab');
                }
            });
        });
    </script>
</body></html>
