{% extends "intern/base.html" %}

{% block title %}Personal Information - Intern Tracking{% endblock %}

{% block content %}
<div class="flex flex-wrap justify-between gap-3 p-4">
    <p class="text-[#111318] tracking-light text-[32px] font-bold leading-tight min-w-72">Personal Information</p>
    {% if success %}
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-2 rounded-lg fade-in">
        Changes saved successfully!
    </div>
    {% endif %}
</div>
<form action="/intern/personal-info" method="POST">
    <h3 class="text-[#111318] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Personal Details</h3>
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">First Name</p>
            <input name="first_name"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.full_name.split(' ')[0] if profile and profile.full_name else '' }}" />
        </label>
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Last Name</p>
            <input name="last_name"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.full_name.split(' ')[1] if profile and profile.full_name and ' ' in profile.full_name else '' }}" />
        </label>
    </div>
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Preferred Name</p>
            <input name="preferred_name"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.preferred_name if profile and profile.preferred_name else '' }}" />
        </label>
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Pronouns</p>
            <input name="pronouns"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.pronouns if profile and profile.pronouns else '' }}" />
        </label>
    </div>
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Date of Birth</p>
            <input name="dob" type="date"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.dob if profile else '' }}" />
        </label>
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Gender</p>
            <div class="relative">
                <select name="gender"
                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all appearance-none">
                    <option value="" disabled {% if not profile or not profile.gender %}selected{% endif %}>Select
                        Gender</option>
                    <option value="Male" {% if profile and profile.gender=='Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if profile and profile.gender=='Female' %}selected{% endif %}>Female
                    </option>
                </select>
                <div class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-[#616f89]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                        viewBox="0 0 256 256">
                        <path
                            d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z">
                        </path>
                    </svg>
                </div>
            </div>
        </label>
    </div>
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Nationality</p>
            <input name="nationality"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.nationality if profile and profile.nationality else '' }}" />
        </label>
    </div>
    <h3 class="text-[#111318] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Contact Information
    </h3>
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Email</p>
            <input name="email" type="email"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.email if profile else '' }}" />
        </label>
    </div>
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Phone Number</p>
            <input name="phone"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.phone if profile and profile.phone else '' }}" />
        </label>
    </div>
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Address</p>
            <input name="address"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.address if profile and profile.address else '' }}" />
        </label>
    </div>
    <h3 class="text-[#111318] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Emergency Contact</h3>
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Contact Name</p>
            <input name="emergency_name"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.emergency_contact_name if profile and profile.emergency_contact_name else '' }}" />
        </label>
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Relationship</p>
            <input name="emergency_relation"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.emergency_contact_relation if profile and profile.emergency_contact_relation else '' }}" />
        </label>
    </div>
    <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
        <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#111318] text-base font-medium leading-normal pb-2">Contact Phone Number</p>
            <input name="emergency_phone"
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] focus:outline-0 focus:ring-0 border border-[#dbdfe6] bg-white focus:border-[#4f46e5] h-14 placeholder:text-[#616f89] p-[15px] text-base font-normal leading-normal transition-all"
                value="{{ profile.emergency_contact_phone if profile and profile.emergency_contact_phone else '' }}" />
        </label>
    </div>
    <div class="flex px-4 py-3 justify-end">
        <button type="submit"
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-[#135bec] text-white text-sm font-bold leading-normal tracking-[0.015em] hover:bg-blue-700 transition-colors shadow-lg active:scale-95">
            <span class="truncate">Save Changes</span>
        </button>
    </div>
</form>
{% endblock %}
